###############################################################################
# CI
#
# The point of this file on a take-home: the checks described in the write-up
# are not claims, they are a green tick a reviewer can click into. Nobody should
# have to install Terraform to find out whether the module validates.
#
# Everything here runs without AWS credentials and creates no resources.
###############################################################################

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tools:
    name: Log analyser
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported range, on purpose. The analyser is
        # stdlib-only specifically so it runs on legacy hosts that will never
        # get a Python upgrade — so "it works on old Python" should be a tested
        # claim, not an assumption. The newest version catches the opposite
        # failure: a stdlib behaviour that changed under us.
        python-version: ["3.9", "3.x"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Unit tests
        run: python -m unittest discover -s tools -v

      - name: Reproduce the documented failure modes
        run: |
          chmod +x tools/demo_failure_modes.sh
          ./tools/demo_failure_modes.sh

      - name: Byte-compile check
        run: python -m compileall -q tools

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      # Not pinned to an exact version here because the real gate is the
      # `required_version = "~> 1.13"` constraint in versions.tf — if a future
      # Terraform breaks the constraint, init fails loudly and that is the
      # signal we want. A team repo would pin this to match local tooling.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

      # Native test framework with a mocked provider: no credentials, no
      # resources, no cost. Asserts the security and availability properties
      # the redesign exists to guarantee.
      - name: Test
        run: terraform test

  security:
    name: Static analysis
    runs-on: ubuntu-latest
    # Advisory rather than blocking. These scanners flag real issues and also
    # flag deliberate decisions documented in the code; a take-home should show
    # their output, not a suppression file written to make the badge green.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform
          framework: terraform
          quiet: true
          soft_fail: true
